<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文明历史 · 证据驱动 · CivSlice</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div>
        <p class="eyebrow">CivSlice · 文明切片</p>
        <h1 id="page-title">文明历史 · 证据驱动</h1>
        <p class="subtitle" id="page-subtitle"></p>
      </div>
      <div class="header-meta">
        <span id="scope-label" class="era-label">—</span>
        <span id="era-label" class="era-label">—</span>
        <span id="year-display" class="year-display">—</span>
      </div>
    </div>
  </header>

  <section class="nav-section">
    <div class="nav-row">
      <span class="nav-label">区域</span>
      <div class="region-tabs" id="region-tabs" role="tablist" aria-label="区域"></div>
    </div>
    <div class="nav-row" id="period-row">
      <span class="nav-label">时段</span>
      <div class="period-tabs" id="period-tabs" role="tablist" aria-label="时间段"></div>
    </div>
    <p class="period-range" id="period-range"></p>
    <div class="nav-row" id="country-row">
      <span class="nav-label">国家</span>
      <div class="country-checkboxes" id="country-checkboxes"></div>
    </div>
    <div class="empty-region-msg" id="empty-region-msg" hidden>
      <p class="muted">南极洲暂无文明记录</p>
    </div>
    <section class="swimlane-section" id="swimlane-section" hidden>
      <div class="swimlane-header">
        <h2 class="swimlane-title">泳道总览</h2>
        <p class="swimlane-hint muted">共时地图 · 点击圆点联动主时间轴</p>
      </div>
      <div class="swimlane-axis" id="swimlane-axis" aria-hidden="true"></div>
      <div class="swimlane-lanes" id="swimlane-lanes"></div>
    </section>
  </section>

  <section class="timeline-section">
    <p class="timeline-label muted">主时间轴（聚焦国）</p>
    <div class="timeline-controls">
      <button id="btn-prev" class="btn-icon" title="向前">◀</button>
      <input type="range" id="year-slider" class="year-slider">
      <button id="btn-next" class="btn-icon" title="向后">▶</button>
    </div>
    <div class="timeline-ticks" id="timeline-ticks"></div>
    <div class="snapshot-markers" id="snapshot-markers"></div>
    <p id="world-context" class="world-context"></p>
  </section>

  <nav class="view-tabs" id="view-tabs">
    <button class="view-tab active" data-view="detail">快照详情</button>
    <button class="view-tab" data-view="compare">同时代对照</button>
  </nav>

  <section class="comparison-panel" id="comparison-panel">
    <div class="comparison-panel-header">
      <span class="nav-label">比较参与</span>
      <div class="comparison-bulk-btns">
        <button type="button" class="btn-text" id="compare-select-all">全选</button>
        <button type="button" class="btn-text" id="compare-select-none">全不选</button>
      </div>
    </div>
    <div class="comparison-toggles" id="comparison-toggles"></div>
  </section>

  <main class="main-layout evidence-layout">
    <section class="evidence-main" id="evidence-main"></section>
    <aside class="sidebar">
      <div class="info-card" id="snapshot-info"></div>
      <div class="info-card methodology-card">
        <h3>证据原则</h3>
        <ul id="methodology-list"></ul>
        <details class="confidence-details">
          <summary>可信度分级说明</summary>
          <dl id="confidence-dl"></dl>
        </details>
      </div>
      <div class="info-card" id="hypothesis-card" hidden>
        <h3>假说库</h3>
        <ul id="hypothesis-list" class="hypothesis-list"></ul>
      </div>
    </aside>
  </main>

  <footer class="footer">
    <p>v3 证据驱动标准：先 sources[] 后 aspects[]；正式快照仅用 documented / inferred / absent。详见 <a href="https://github.com/jk9988610/CivSlice">CivSlice</a>。</p>
  </footer>

  <script src="js/navigation.js"></script>
  <script src="js/evidence.js"></script>
  <script src="app.js"></script>
</body>
</html>
