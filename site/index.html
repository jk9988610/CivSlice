<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文明历史 · 十维探索 · CivSlice</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div>
        <p class="eyebrow">CivSlice · 文明切片</p>
        <h1 id="page-title">文明历史 · 十维探索</h1>
        <p class="subtitle" id="page-subtitle"></p>
      </div>
      <div class="header-meta">
        <span id="scope-label" class="era-label">—</span>
        <span id="era-label" class="era-label">—</span>
        <span id="year-display" class="year-display">—</span>
      </div>
    </div>
  </header>

  <section class="nav-section">
    <div class="nav-row">
      <span class="nav-label">区域</span>
      <div class="region-tabs" id="region-tabs" role="tablist" aria-label="区域"></div>
    </div>
    <div class="nav-row" id="period-row">
      <span class="nav-label">时段</span>
      <div class="period-tabs" id="period-tabs" role="tablist" aria-label="时间段"></div>
    </div>
    <p class="period-range" id="period-range"></p>
    <div class="nav-row" id="country-row">
      <span class="nav-label">国家</span>
      <div class="country-checkboxes" id="country-checkboxes"></div>
    </div>
    <div class="empty-region-msg" id="empty-region-msg" hidden>
      <p class="muted">南极洲暂无文明记录</p>
    </div>
    <section class="swimlane-section" id="swimlane-section" hidden>
      <div class="swimlane-header">
        <h2 class="swimlane-title">泳道总览</h2>
        <p class="swimlane-hint muted">共时地图 · 点击圆点联动主时间轴</p>
      </div>
      <div class="swimlane-axis" id="swimlane-axis" aria-hidden="true"></div>
      <div class="swimlane-lanes" id="swimlane-lanes"></div>
    </section>
  </section>

  <section class="timeline-section">
    <p class="timeline-label muted">主时间轴（聚焦国）</p>
    <div class="timeline-controls">
      <button id="btn-prev" class="btn-icon" title="向前">◀</button>
      <input type="range" id="year-slider" class="year-slider">
      <button id="btn-next" class="btn-icon" title="向后">▶</button>
    </div>
    <div class="timeline-ticks" id="timeline-ticks"></div>
    <div class="snapshot-markers" id="snapshot-markers"></div>
    <p id="world-context" class="world-context"></p>
  </section>

  <nav class="view-tabs" id="view-tabs">
    <button class="view-tab active" data-view="profile">剖面</button>
    <button class="view-tab" data-view="compare">对比</button>
  </nav>

  <section class="comparison-panel" id="comparison-panel">
    <div class="comparison-panel-header">
      <span class="nav-label">比较参与</span>
      <div class="comparison-bulk-btns">
        <button type="button" class="btn-text" id="compare-select-all">全选</button>
        <button type="button" class="btn-text" id="compare-select-none">全不选</button>
      </div>
    </div>
    <div class="comparison-toggles" id="comparison-toggles"></div>
  </section>

  <div class="template-banner" id="template-banner" hidden></div>

  <section class="viz-controls" id="viz-controls">
    <div class="mode-toggles" id="profile-toggles">
      <label class="toggle-label">
        <input type="checkbox" id="toggle-speculative">
        <span>含猜测轮廓</span>
      </label>
    </div>
    <div class="mode-toggles" id="compare-toggles" hidden>
      <label class="toggle-label" id="avg-toggle-wrap">
        <input type="checkbox" id="toggle-average">
        <span>显示同期均值</span>
      </label>
    </div>
  </section>

  <main class="main-layout">
    <section class="viz-section">
      <div class="viz-core">
        <div class="radar-wrap">
          <canvas id="radar-canvas" width="280" height="280" aria-label="雷达图"></canvas>
          <p class="radar-legend-mini" id="radar-legend-profile">
            <span class="dot documented"></span>有据
            <span class="dot inferred"></span>推断
            <span class="dot speculative"></span>猜测
          </p>
          <p class="radar-legend-mini" id="radar-legend-compare" hidden>
            <span class="grade-sample">S–E</span> 档位 · 0–100
          </p>
          <p class="radar-aux-label" id="radar-aux-label" hidden></p>
          <div class="compare-legend" id="compare-legend" hidden></div>
        </div>
        <div class="cards-wrap">
          <div class="cards-header">
            <h2 class="panel-title" id="cards-title">维度详情</h2>
            <p class="cards-hint muted" id="cards-hint">悬停联动 · 点击展开</p>
          </div>
          <div class="dimension-grid" id="dimension-grid"></div>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="info-card" id="snapshot-info"></div>
      <div class="info-card methodology-card">
        <h3>科学方法原则</h3>
        <ul id="methodology-list"></ul>
        <details class="confidence-details">
          <summary>可信度分级说明</summary>
          <dl id="confidence-dl"></dl>
        </details>
      </div>
    </aside>
  </main>

  <footer class="footer">
    <p>剖面为十维史料层；对比为派生指标（运行时计算，非 JSON 存储）。详见 <a href="https://github.com/jk9988610/CivSlice">CivSlice</a>。</p>
  </footer>

  <script src="js/templates.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/radar.js"></script>
  <script src="app.js"></script>
</body>
</html>
