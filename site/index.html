<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中国历史 · 十维探索 · CivSlice</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div>
        <p class="eyebrow">CivSlice · 文明切片</p>
        <h1 id="page-title">中国历史 · 十维探索</h1>
        <p class="subtitle" id="page-subtitle"></p>
      </div>
      <div class="header-meta">
        <span id="era-label" class="era-label">—</span>
        <span id="year-display" class="year-display">—</span>
      </div>
    </div>
  </header>

  <section class="timeline-section">
    <div class="timeline-controls">
      <button id="btn-prev" class="btn-icon" title="向前">◀</button>
      <input type="range" id="year-slider" class="year-slider">
      <button id="btn-next" class="btn-icon" title="向后">▶</button>
    </div>
    <div class="timeline-ticks" id="timeline-ticks"></div>
    <div class="snapshot-markers" id="snapshot-markers"></div>
    <p id="world-context" class="world-context"></p>
  </section>

  <main class="main-layout">
    <section class="viz-section">
      <div class="radar-panel">
        <h2 class="panel-title">十维雷达</h2>
        <canvas id="radar-canvas" width="380" height="380"></canvas>
        <p class="radar-legend">
          <span class="dot documented"></span>有据
          <span class="dot inferred"></span>推断
          <span class="dot speculative"></span>猜测
          <span class="dot absent"></span>未记录
        </p>
      </div>

      <div class="cards-panel">
        <h2 class="panel-title">维度详情</h2>
        <div class="dimension-grid" id="dimension-grid"></div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="info-card" id="snapshot-info"></div>
      <div class="info-card methodology-card">
        <h3>科学方法原则</h3>
        <ul id="methodology-list"></ul>
        <details class="confidence-details">
          <summary>可信度分级说明</summary>
          <dl id="confidence-dl"></dl>
        </details>
      </div>
    </aside>
  </main>

  <footer class="footer">
    <p>等级 1–5 为文明内部相对概括，非精确统计。详见 <a href="https://github.com/jk9988610/CivSlice">CivSlice 仓库</a>。</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
